<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 2</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function ProductDetails({imageSrc, name, price, discountPrice}){
            return(
                <div>
                    <img src={imageSrc} width="50" />
                    <p>{name}</p>
                    

                    {discountPrice && 
                        <>
                            <del>Price: {price}</del>
                            <p>Discount Price: {discountPrice}</p>
                        </>
                    }

                    {!discountPrice && 
                        <>
                            <p>Price: {price}</p>
                        </>
                    }

                    {discountPrice ? (
                        <>
                            <del>Price: {price}</del>
                            <p>Discount Price: {discountPrice}</p>
                        </> 
                    ) : (
                        <>
                            <p>Price: {price}</p>
                        </>
                    )}
                    
                    <button>Add to Cart</button>

                    </div>
            );
        }

        function App(){
            return(
                <>
                    <ProductDetails
                        imageSrc="../assets/cotton-socks.png" 
                        name="Cotton socks"
                        price="$10.90"
                        discountPrice="$5.45"
                    />

                    <ProductDetails 
                        imageSrc="../assets/plain-t-shirt.png"
                        name="Cotton socks 2"
                        price="$1.90"
                    />

                    <ProductDetails 
                        imageSrc="../assets/tennis-balls.png"
                        name="Cotton socks 3"
                        price="$1"
                    />
                </>
            );
        }
        

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
