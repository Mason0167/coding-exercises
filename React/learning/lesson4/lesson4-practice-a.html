<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4</title>
    <style>
      body {
        font-family: Arial;
      }

      .title {
        font-size: 25px;
      }

      .login-input {
        padding: 10px 15px;
        margin-bottom: 10px;
        border-radius: 5px;
        border-width: 1px;
        width: 200px;
      }

      .login-button {
        background-color: rgb(0, 123, 255);
        color: white;
        margin-right: 5px;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function LoginForm({ showPassword, setShowPassword }){
        const [inputText, setInputText] = React.useState('');

        function toggleButton(event){

            if(showPassword === true){
                setShowPassword(false);
            }else{
                setShowPassword(true);
            }
        }

        function saveInputText(event){
            setInputText(event.target.value);;
        }

        return (
          <>
            <div>
                <input placeholder="Email" className="login-input" />
            </div>

            <div>
                <input 
                    placeholder="Password" 
                    className="login-input"
                    onChange={saveInputText}
                    value={inputText}
                    type={ showPassword ? "text" : "password"} 
                />

                <button 
                    onClick={toggleButton}
                    className="hide-button"
                    
                >Hide
                </button>
            </div>

            <button className="login-button">Login</button>
            <button className="login-button">Sign Up</button>
          </>
        );
      }

      function TimeSetting({ time, setTime }){

          React.useEffect(() => {
              setInterval(() => {
                  setTime(dayjs().format('HH:mm:ss'))
                  console.log('run code')
              }, 1000)

          // Run once after the component is created
          }, [])

        return(
          <>
            <p>{time}</p>
          </>
        )
      }

      function App(){
        const [showPassword, setShowPassword] = React.useState('');
        const [time, setTime] = React.useState(dayjs().format('HH:mm:ss'));

        return (
          <>
            <TimeSetting 
                time={time}
                setTime={setTime}
            />
            <p className="title">Hello, welcome to my website</p>
            <LoginForm 
                showPassword={showPassword}
                setShowPassword={setShowPassword}
            />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
