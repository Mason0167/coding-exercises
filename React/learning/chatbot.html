<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial;

        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button{
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
      }

      .chat-input{
        font-size: 15px;
        padding: 12px 15px;
        border-width: 1px;
        border-radius: 10px;
        margin-right: 10px;

        /* Make an element grow and take up the remaining space */
        flex-grow: 1;
      }

      .chat-input-container{
        display: flex;
        margin-bottom: 60px;

      }

      .app-container{
        max-width: 600px;
        height: 100vh;
        
        margin-left: auto;
        margin-right: auto;

        display: flex;
        flex-direction: column;
      }

      .chat-message-user{
        display: flex;
        justify-content: end;

        /* By default is stretch */
        align-items: start;
      }

      .chat-message-robot{
        display: flex;
        justify-content: start;
        align-items: start;
      }

      .chat-message-text{
        background-color: rgb(238, 238, 238);
        
        padding: 15px 20px;
        border-radius: 10px;
        max-width: 300px;

        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
      }

      .chat-message-profile{
        width: 45px;
      }

      .chat-message-container{
        flex-grow: 1;
        margin-top: 20px;

        /* To make the container scrollable */
        overflow: scroll;
        /* Delete the width */
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }){
          // Store the current data, second one is updater function
          const [inputText, setInputText] = React.useState('');

          function saveInputText(event){
            // Gives us the element that we're typing in
            setInputText(event.target.value);
          }

          function keyPress(event){
            {event.key === 'Enter' && sendMessage()}
            {event.key === 'Escape' && setInputText('')}
          }

          async function sendMessage(){

            const newChatMessages = [
              ...chatMessages,
              {
                message: inputText,
                sender: 'user',
                id: crypto.randomUUID()
              }
            ];

            setChatMessages(newChatMessages);

            const response = await Chatbot.getResponseAsync(inputText);
            setChatMessages([
              ...newChatMessages,
              {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);

            setInputText('');
          }

          return (
            <div className="chat-input-container">
              <input 
                placeholder="Send a message to Chatbot" 
                size="30" 
                onChange={saveInputText}
                onKeyDown={keyPress}
                value={inputText}
                className="chat-input"
              />

              <button
                onClick={sendMessage}
                className="send-button"
              >Send</button>
            </div>
          );
        }

        function ChatMessage({ message, sender }){
          /* 
          const message = props.message;
          const sender = props.sender; 
          const { message, sender } = props;

          if(sender === 'robot'){
            return(
              <div>
                <img src="robot.png" width="50"/>
                {message}
              </div>
            );
          }
          */

          
          return (
            <div className={
              sender === 'user' 
                ? 'chat-message-user' 
                : 'chat-message-robot'
            }>

              {sender === 'robot' && (
                <img src="../assets/robot.png" className="chat-message-profile" />
              ) }

              <div className="chat-message-text">
                {message}
              </div>

              {sender === 'user' && (
                <img src="../assets/user.png" className="chat-message-profile" />
              )}
              
            </div>
          );
        }

        function ChatMessages({ chatMessages }){
          const chatMessagesRef = React.useRef(null);

          React.useEffect(() => {
            const containerElem = chatMessagesRef.current;
            if (containerElem) {
              containerElem.scrollTop = containerElem.scrollHeight
            }

            /* Dependency Array: Controls when useEffect runs. 
            [] => Only run once, after the component is created */
          }, [chatMessages]);

          return(
            <div 
              className="chat-message-container"
              ref={chatMessagesRef}
              >
              {chatMessages.map((chatMessage) => {
                return(
                  <ChatMessage 
                    message = {chatMessage.message}
                    sender = {chatMessage.sender}
                    key={chatMessage.id}
                  />
              );})}
            </div>
          );
        }

        function App(){

          const [chatMessages, setChatMessages] = React.useState([{
            message: 'hello chatbot',
            sender: 'user',
            id: 'id1'
          }, {
            message: 'Hello! How can I help you?',
            sender: 'robot',
            id: 'id2'
          }, {
            message: 'Can you get me todays date?',
            sender: 'user',
            id: 'id3'
          }, {
            message: 'Today is September 27',
            sender: 'robot',
            id: 'id4'
          }]);

          /*
          // ShortCut: To extract the values
          const [chatMessages, setChatMessages] = array

          // Current data
          const chatMessages = array[0];

          // Updater function : Function that update the array
          // Always use this to update the data, so React will update the HTML
          const setChatMessages = array[1];

          // We should always create a copy, and then modify the copy
            // This helps React be more efficient
            setChatMessages([
              ...chatMessages,
              {
                message: 'test',
                sender: 'user',
                id: crypto.randomUUID()
              }
            ]);
          }
          */ 

          return (
            <div className="app-container">
              <ChatInput 
                chatMessages={chatMessages}
                setChatMessages={setChatMessages}
              />
              
              <ChatMessages 
                chatMessages={chatMessages}
              />
            </div>
          );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
